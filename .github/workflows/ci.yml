name: CI
# The Lean app's checks on every pull request and push to main, by ElmLean's ios-app workflow: one job builds
# the Lean once (every proof checked) and caches it; `tests`, `extra` (the regtest node) and `app` (the iOS
# builds and the UI journeys) restore that build and run in parallel, on WarpBuild runners (a fork's pull
# request gets no CI: push it to a branch here). The ElmLean commit below is the one LeanApp/lake-manifest.json pins; the
# build job fails if they differ.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  app:
    uses: posix4e/elmlean/.github/workflows/ios-app.yml@ccbb1b4019275e257a413b017a8347640c30efae # v0.1.0
    with:
      elmlean: ccbb1b4019275e257a413b017a8347640c30efae
      runs-on: warp-macos-26-arm64-12x
      lean-packages: Lean LeanApp
      build-targets: |
        Lean multisig-test ledger-test silent-payment-test io-test multisig-differential census-check
        LeanApp records-test multisig-app-test ledger-transport-test backend-test
      app-dir: LeanApp
      app-root: WinnowApp
      scheme: WinnowLean
      # the census list the app bundles: signature verified, health filtered, once per run
      prepare: scripts/import-census && cp build/census/peers-source.txt "$CI_RESULTS/"
      carry: build/census/
      tests: |
        . Lean/.lake/build/bin/census-check build/census/peers.json
        . CENSUS_CHECK="$PWD/Lean/.lake/build/bin/census-check" python3 -m unittest discover -s scripts/tests -v
        Lean .lake/build/bin/multisig-test
        Lean .lake/build/bin/ledger-test
        Lean .lake/build/bin/silent-payment-test
        LeanApp .lake/build/bin/records-test
        LeanApp .lake/build/bin/multisig-app-test
        LeanApp .lake/build/bin/ledger-transport-test
      extra: scripts/ci-regtest
      release-check: scripts/verify-release-no-test-mode
      ui-name: journey
      # the only iPhone the WarpBuild runner's newest iOS runtime (27.1) has; the website's screenshots are this size
      ui-device-type: iPhone Duo
      ui-before: scripts/ui-fixture start
      ui-after: scripts/ui-fixture stop
      # the website (winnowwallet/website, scripts/fetch-journey-media) takes this from main's newest successful run
      after-ui: scripts/journey-media
      publish-name: journey-media
      publish-path: build/journey-media/
