name: CI
# The Lean app's checks, by LeanNative's ios-app workflow (LeanNative/leannative, formerly posix4e/elmlean):
# two jobs on GitHub's own macOS runners (free for a public repository) that start at once, `lean` (the Lean
# built, every proof checked, then every test below at the same time, the regtest node's among them) and `app`
# (the iOS builds and the UI journeys). It runs on pull
# requests that are ready for review and change more than the docs, on a push to main that does, nightly on main
# when its commit has not passed yet, and by hand. Every run is the same full run: every test, all five journeys,
# the Release builds and the website's media. release.yml looks for one on the tag's tree that is not a pull
# request's instead of testing again.
# The LeanNative commit below is the one LeanApp/lake-manifest.json pins; both jobs fail if they differ. Actions
# does not follow repository redirects for reusable workflows, so the owner/repo here is the framework's real home.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # nightly: nothing to run when this commit of main already passed, as it has when its push run succeeded; the
  # night after a push whose run failed, or that changed only the docs, runs it
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count)
          echo "successful runs on main at $GITHUB_SHA: $n"
          if [ "$n" -gt 0 ]; then echo tested=true; else echo tested=false; fi >> "$GITHUB_OUTPUT"
  app:
    needs: nightly
    # a draft pull request runs nothing until it is ready for review
    if: >-
      ${{ !cancelled() && needs.nightly.outputs.tested != 'true'
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    uses: LeanNative/leannative/.github/workflows/ios-app.yml@97a6f7c6f5f76e6e01fcd24cec48d5caffb1e79a
    with:
      leannative: 97a6f7c6f5f76e6e01fcd24cec48d5caffb1e79a
      # GitHub's hosted macOS runner (macos-26: Xcode 26, iOS 26 simulators), the reusable workflow's default
      runs-on: macos-26
      lean-packages: Lean LeanApp
      build-targets: |
        Lean multisig-test ledger-test silent-payment-test crypto-test io-test multisig-differential census-check
        LeanApp records-test multisig-app-test ledger-transport-test backend-test journeys
      app-dir: LeanApp
      app-root: WinnowApp
      scheme: WinnowLean
      # the census list the app bundles: signature verified, health filtered (each job imports it)
      prepare: scripts/import-census && cp build/census/peers-source.txt "$CI_RESULTS/"
      tests: |
        . Lean/.lake/build/bin/census-check build/census/peers.json
        . CENSUS_CHECK="$PWD/Lean/.lake/build/bin/census-check" python3 -m unittest discover -s scripts/tests -v
        Lean .lake/build/bin/multisig-test
        Lean .lake/build/bin/ledger-test
        Lean .lake/build/bin/silent-payment-test
        Lean .lake/build/bin/crypto-test
        LeanApp .lake/build/bin/records-test
        LeanApp .lake/build/bin/multisig-app-test
        LeanApp .lake/build/bin/ledger-transport-test
        . scripts/ci-regtest io
        . scripts/ci-regtest backend
        . scripts/ci-regtest differential
      # the journeys headless against the app itself (LeanNative's wire-journeys), one more line of the tests above,
      # with the simulator run's fixture as its hooks
      wire-journey: journeys
      # the Release build ignores test mode's environment: launched with it, Debug (the control) starts a test-mode
      # run and journals it, and Release boots into its ordinary storage (LeanNative's test-mode-check)
      test-mode-env: |
        WINNOW_E2E=1
        WINNOW_E2E_RUN=releasecheck
        WINNOW_E2E_RESET=1
        WINNOW_E2E_ENTROPY=000102030405060708090a0b0c0d0e0f
        WINNOW_LEAN_SAMPLE=1
        WINNOW_LEAN_TRACE=1
      test-mode-marker: Library/Application Support/BTCSwiftE2E-releasecheck/story-events.jsonl
      release-marker: Library/Application Support/BTCSwift
      release-builds: true
      ui-name: journey
      # the iPhone on the hosted runner's newest iOS runtime; the website's screenshots are this size
      ui-device-type: iPhone 17 Pro
      ui-before: scripts/ui-fixture start
      ui-after: scripts/ui-fixture stop
      # the journeys are Lean on the Mac (LeanApp/Journeys.lean), all five with XCTest's real touches
      # (LeanNative's LNDriver, one snapshot per step) on one simulator: a hosted runner has the cores for one
      ui-journey: journeys
      # the website (winnowwallet/website, scripts/fetch-journey-media) takes this from main's newest successful run:
      # LeanNative's journey-media, in the layout and names the website reads
      journey-media: build/journey-media
      journey-media-args: >-
        --video videos/wallet-journey.mp4 --journeys LeanApp/Journeys.lean --test-prefix test --field network=regtest
      publish-name: journey-media
      publish-path: build/journey-media/
