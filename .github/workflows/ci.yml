name: CI
# The Lean app's checks, by LeanNative's ios-app workflow (LeanNative/leannative, formerly posix4e/elmlean):
# three jobs on GitHub's own macOS runners (free for a public repository) that start at once, `lean` (the Lean
# built, every proof checked, then every test below at the same time, the regtest node's among them), `app`
# (the Debug simulator build and the UI journeys, split across two runners; `media` joins their recordings) and
# `release` (the Release builds and the test-mode check).
# It runs on pull
# requests that are ready for review and change more than the docs, on every push to main, and by hand. Every
# run is the same full run: every test, all seven journeys, the Release builds and the website's media.
# release.yml looks for one on the tag's tree that is not a pull request's instead of testing again: main's
# commit has one once its push run passes; after a push run that failed, or a force-push (which starts no push
# run), run this by hand before tagging.
# The LeanNative commit below is the one LeanApp/lake-manifest.json pins; every job fails if they differ. Actions
# does not follow repository redirects for reusable workflows, so the owner/repo here is the framework's real home.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # every push, docs included, so that main's commit always has a run a tag can use
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  app:
    # a draft pull request runs nothing until it is ready for review
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    uses: LeanNative/leannative/.github/workflows/ios-app.yml@7b7253143596375e518e55e003903c68bc825143
    with:
      leannative: 7b7253143596375e518e55e003903c68bc825143
      # GitHub's hosted macOS runner (macos-26: Xcode 26, iOS 26 simulators), the reusable workflow's default; or,
      # when the repository variable MACOS_RUNNER is set, that label (a self-hosted Mac while GitHub's are backed
      # up: delete the variable before it goes away, or the jobs wait for it). A fork's pull request always runs
      # on GitHub's: a self-hosted runner never runs code from outside the repository.
      runs-on: ${{ (github.event.pull_request.head.repo.fork && 'macos-26') || vars.MACOS_RUNNER || 'macos-26' }}
      lean-packages: Lean LeanApp
      build-targets: |
        Lean multisig-test ledger-test silent-payment-test crypto-test io-test multisig-differential census-check
        LeanApp records-test multisig-app-test ledger-transport-test backend-test cloud-backup-test journeys
      app-dir: LeanApp
      app-root: WinnowApp
      scheme: WinnowLean
      # the census list the app bundles: signature verified, health filtered (each job imports it)
      prepare: scripts/import-census && cp build/census/peers-source.txt "$CI_RESULTS/"
      tests: |
        . Lean/.lake/build/bin/census-check build/census/peers.json
        . CENSUS_CHECK="$PWD/Lean/.lake/build/bin/census-check" python3 -m unittest discover -s scripts/tests -v
        Lean .lake/build/bin/multisig-test
        Lean .lake/build/bin/ledger-test
        Lean .lake/build/bin/silent-payment-test
        Lean .lake/build/bin/crypto-test
        LeanApp .lake/build/bin/records-test
        LeanApp .lake/build/bin/multisig-app-test
        LeanApp .lake/build/bin/ledger-transport-test
        LeanApp .lake/build/bin/cloud-backup-test
        . scripts/ci-regtest io
        . scripts/ci-regtest backend
        . scripts/ci-regtest differential
      # the journeys headless against the app itself (LeanNative's wire-journeys), one more line of the tests above,
      # with the simulator run's fixture as its hooks
      wire-journey: journeys
      # the Release build ignores test mode's environment: launched with it, Debug (the control) starts a test-mode
      # run and journals it, and Release boots into its ordinary storage (LeanNative's test-mode-check)
      test-mode-env: |
        WINNOW_E2E=1
        WINNOW_E2E_RUN=releasecheck
        WINNOW_E2E_RESET=1
        WINNOW_E2E_ENTROPY=000102030405060708090a0b0c0d0e0f
        WINNOW_LEAN_SAMPLE=1
        WINNOW_LEAN_TRACE=1
      test-mode-marker: Library/Application Support/BTCSwiftE2E-releasecheck/story-events.jsonl
      release-marker: Library/Application Support/BTCSwift
      release-builds: true
      ui-name: journey
      # the iPhone on the hosted runner's newest iOS runtime; the website's screenshots are this size
      ui-device-type: iPhone 17 Pro
      ui-before: scripts/ui-fixture start
      ui-after: scripts/ui-fixture stop
      # the journeys are Lean on the Mac (LeanApp/Journeys.lean), all seven with XCTest's real touches
      # (LeanNative's LNDriver, one snapshot per step) on one simulator: a hosted runner has the cores for one
      ui-journey: journeys
      # two runners at once, three and four journeys (five took about 3.5 minutes each; one runner: 6.6); the media
      # job joins their recordings into the website's one video, the journeys in Journeys.lean's order
      ui-journey-shards: '["createReceiveSendConfirm multisigTwoOfThreeWithRecovery feeBumpReplaceConfirm", "ledgerPairVerifySpend shippedCensus silentPaymentSend spentElsewhere"]'
      # the website (winnowwallet/website, scripts/fetch-journey-media) takes this from main's newest successful run:
      # LeanNative's journey-media, in the layout and names the website reads
      journey-media: build/journey-media
      journey-media-args: >-
        --video videos/wallet-journey.mp4 --journeys LeanApp/Journeys.lean --test-prefix test --field network=regtest
      publish-name: journey-media
      publish-path: build/journey-media/
