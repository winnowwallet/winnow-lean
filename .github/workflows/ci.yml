name: CI
# The Lean app's checks, by LeanNative's ios-app workflow (LeanNative/leannative, formerly posix4e/elmlean):
# two WarpBuild jobs that start at once, `lean` (the Lean built, every proof checked, then every test below at the
# same time, the regtest node's among them) and `app` (the iOS builds and the UI journeys). It runs on pull
# requests that are ready for review and change more than the docs, on a push to main that does, nightly on main
# when its commit has not passed yet, and by hand. Every run is the same full run: every test, all five journeys,
# the Release builds and the website's media. release.yml looks for one on the tag's tree that is not a pull
# request's instead of testing again.
# The LeanNative commit below is the one LeanApp/lake-manifest.json pins; both jobs fail if they differ. Actions
# does not follow repository redirects for reusable workflows, so the owner/repo here is the framework's real home.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # nightly: nothing to run when this commit of main already passed, as it has when its push run succeeded; the
  # night after a push whose run failed, or that changed only the docs, runs it
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count)
          echo "successful runs on main at $GITHUB_SHA: $n"
          if [ "$n" -gt 0 ]; then echo tested=true; else echo tested=false; fi >> "$GITHUB_OUTPUT"
  app:
    needs: nightly
    # a draft pull request runs nothing until it is ready for review
    if: >-
      ${{ !cancelled() && needs.nightly.outputs.tested != 'true'
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    uses: LeanNative/leannative/.github/workflows/ios-app.yml@300cfa3025dff1cb265fa2999c75a77bafc04a49
    with:
      leannative: 300cfa3025dff1cb265fa2999c75a77bafc04a49
      runs-on: warp-macos-26-arm64-12x
      # the UI journeys drive one simulator: half the runner, half the price
      app-runs-on: warp-macos-26-arm64-6x
      lean-packages: Lean LeanApp
      build-targets: |
        Lean multisig-test ledger-test silent-payment-test crypto-test io-test multisig-differential census-check
        LeanApp records-test multisig-app-test ledger-transport-test backend-test
      app-dir: LeanApp
      app-root: WinnowApp
      scheme: WinnowLean
      # the census list the app bundles: signature verified, health filtered (each job imports it)
      prepare: scripts/import-census && cp build/census/peers-source.txt "$CI_RESULTS/"
      tests: |
        . Lean/.lake/build/bin/census-check build/census/peers.json
        . CENSUS_CHECK="$PWD/Lean/.lake/build/bin/census-check" python3 -m unittest discover -s scripts/tests -v
        Lean .lake/build/bin/multisig-test
        Lean .lake/build/bin/ledger-test
        Lean .lake/build/bin/silent-payment-test
        Lean .lake/build/bin/crypto-test
        LeanApp .lake/build/bin/records-test
        LeanApp .lake/build/bin/multisig-app-test
        LeanApp .lake/build/bin/ledger-transport-test
        . scripts/ci-regtest io
        . scripts/ci-regtest backend
        . scripts/ci-regtest differential
      release-check: scripts/verify-release-no-test-mode
      release-builds: true
      ui-name: journey
      # the only iPhone the WarpBuild runner's newest iOS runtime (27.1) has; the website's screenshots are this size
      ui-device-type: iPhone Duo
      ui-before: scripts/ui-fixture start
      ui-after: scripts/ui-fixture stop
      # the journeys are Lean on the Mac (LeanApp/Journeys.lean), two simulators at once: the wallet journey with
      # XCTest's real touches (its recording is the website's video), the other four on the app's own driver
      # (LeanNative's LNAppDriver: no XCTest lookups or waits)
      ui-journey: journeys
      ui-lanes: >-
        xctest:createReceiveSendConfirm
        app:multisigTwoOfThreeWithRecovery,ledgerPairVerifySpend,shippedCensus,silentPaymentSend
      # the website (winnowwallet/website, scripts/fetch-journey-media) takes this from main's newest successful run
      after-ui: scripts/journey-media
      publish-name: journey-media
      publish-path: build/journey-media/
