name: Release

# A vMAJOR.MINOR.PATCH tag builds the Lean app as com.btcswift.app (the Swift app it replaces: same bundle
# identifier and team, meant to keep an installed wallet) and sends it to TestFlight's internal group, once a CI
# run outside a pull request (a push to main, nightly or by hand) has passed on the same tree: the release finds
# that run instead of testing again. It is LeanNative's release workflow (ios-release.yml) at the commit the app
# pins; the steps are LeanNative's `leannative-release`. A manual run does everything up to the upload (the
# build, signing, the archive and export with their checks, a read-only App Store Connect call) and publishes
# nothing.
#
# The build ships the newest census (scripts/import-census: signature verified, health-filtered); What to Test
# names it in a last paragraph added on the runner only, and peers-source.txt is kept as the release artifact.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: LeanNative/leannative/.github/workflows/ios-release.yml@97a6f7c6f5f76e6e01fcd24cec48d5caffb1e79a
    with:
      leannative: 97a6f7c6f5f76e6e01fcd24cec48d5caffb1e79a
      lean-packages: Lean LeanApp
      app-dir: LeanApp
      app-root: WinnowApp
      scheme: WinnowLean
      bundle-id: com.btcswift.app
      team-id: 2858MX5336
      icloud-container: iCloud.com.btcswift.app
      what-to-test: docs/testflight-what-to-test.txt
      prepare: scripts/import-census
      notes-line: "grep -m1 '^Peers: census ' build/census/peers-source.txt"
      keep-path: build/census/peers-source.txt
      upload: ${{ github.event_name == 'push' }}
    # named, not inherited: `secrets: inherit` reaches only a workflow in the same organization
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
      DEV_CERT_P12_PASSWORD: ${{ secrets.DEV_CERT_P12_PASSWORD }}
