# The Winnow app in Lean (ElmLean native mode), with no Swift at all. The generic ElmLean shell (renderer,
# store, capabilities: Objective-C printed by `lake exe elmshell` into build/native-shell, never checked in;
# and the C shim) plus the C that Lean generated for WinnowApp, the Lean WalletCore port and ElmLean
# (build/lean-c); both from ios_lean_sources.sh. Linked with Lean's runtime retargeted to iOS (build/lib).
name: WinnowLean
options:
  bundleIdPrefix: com.btcswift
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "27.1"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WinnowLean:
    type: application
    platform: iOS
    sources:
      - { path: build/native-shell, name: ElmLeanShell }
      - { path: ../.lake/packages/elmlean/framework/native/c, name: ElmLeanShim }
      - { path: build/lean-c, name: LeanC, compilerFlags: [-w] }
      # the design papers, bundled as the Swift app bundles them (shown by the `page` node)
      - { path: ../../docs/site.css, buildPhase: resources }
      - { path: ../../docs/mobile.html, buildPhase: resources }
      - { path: ../../docs/read-side.html, buildPhase: resources }
      - { path: ../../docs/write-side.html, buildPhase: resources }
      - { path: ../../docs/import.html, buildPhase: resources }
      # the census list this build ships (CensusCatalog.bundled reads peers.json beside the executable),
      # fetched by scripts/import-census (scripts/build-ios runs it when the list is missing)
      - { path: ../../build/census/peers.json, buildPhase: resources }
      # the app icon (upstream's Assets.xcassets: one 1024 pt icon; Xcode makes the other sizes)
      - { path: Assets.xcassets }
    # automatic iCloud backup (WinnowApp/Real/CloudBackup.lean): the private database of upstream's container
    # (CloudKit/schema.ckdb's WalletBackup records); the shell answers missingEntitlement without it
    entitlements:
      path: build/WinnowLean.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.btcswift.app
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Winnow
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # upstream's orientations: portrait on iPhone, all four on iPad
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # the shell's scene delegate (ElmLeanShell.h)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: ELSceneDelegate
        NSFaceIDUsageDescription: "Approve payments and reveal your recovery words."
        # a paired Ledger signs multisig spends over the shell's ble.* capabilities (upstream's text)
        NSBluetoothAlwaysUsageDescription: "Winnow talks to your Ledger over Bluetooth to have it sign multisig payments you approve on its screen."
        ITSAppUsesNonExemptEncryption: false
        # Automatic routing asks Tailscale's MagicDNS and probes the gateways it names (upstream's text)
        NSLocalNetworkUsageDescription: "Winnow checks your Tailscale gateways and connects to Bitcoin nodes you configure."
        # background chain checks (WinnowApp/Real/BackgroundSync.lean): iOS decides when they run; each is one
        # bounded scan with the foreground's routing. The shell registers a handler for each identifier.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.btcswift.winnow.chain-refresh
          - com.btcswift.winnow.chain-processing
    settings:
      base:
        # the Swift app's identity, which this app replaces on TestFlight: the same bundle identifier and team,
        # meant to let an update keep an installed wallet's Keychain items and files (not yet tried over an
        # installed Swift build); release.yml sets the versions from the tag
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 2858MX5336
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: WinnowLean
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: ["$(HOME)/.elan/toolchains/leanprover--lean4---v4.35.0/include", "$(PROJECT_DIR)/../.lake/packages/elmlean/framework/native/c"]
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/build/lib"]
        OTHER_LDFLAGS: [-lLean, -lStd, -lInit, -lleanrt, -luv, -lgmp, -lc++]
        DEAD_CODE_STRIPPING: YES
        # Lean's generated C at -O3 in every configuration, as Lean builds it (at -O0 key derivation is ~10x slower)
        GCC_OPTIMIZATION_LEVEL: "3"
        # ad-hoc signed in the simulator: an unsigned app has no Keychain entitlement (errSecMissingEntitlement)
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        # Lean's runtime is arm64 only (build/lib): no Intel simulator slice
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # as upstream: the iPad app also runs on Apple silicon Macs ("Designed for iPad"); no Mac Catalyst build
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
  # The UI journeys (Objective-C XCUITest, UITests/): run by scripts/ui-journeys (CI: ElmLean ui-tests with scripts/ui-fixture) against a regtest fixture.
  WinnowLeanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      # LeanNative's XCTest kit, in this target only: the app never links XCTest
      - { path: ../.lake/packages/elmlean/framework/native/testkit, name: ElmLeanTestKit }
    dependencies:
      - target: WinnowLean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WinnowLean
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  WinnowLean:
    build:
      targets:
        WinnowLean: all
        WinnowLeanUITests: [test]
    test:
      config: Debug
      targets: [WinnowLeanUITests]
