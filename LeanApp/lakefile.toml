# The Winnow app in Lean (LeanNative native mode): Model, Msg, update, view, commands; the wallet is the
# Lean port in ../Lean. Built into the iOS app by LeanNative's framework/native (see ../PORT.md).
name = "winnowapp"
defaultTargets = ["WinnowApp"]

[[require]]
name = "winnow"
path = "../Lean"

# LeanNative (formerly ElmLean), pinned: the framework's Lean package
# (framework/lean) and, beside it, the native shell's C shim and build scripts (framework/native), at
# .lake/packages/leannative/framework after `lake update`. The same commit is the `uses:` and `leannative:` of
# .github/workflows/ci.yml.
[[require]]
name = "leannative"
git = "https://github.com/LeanNative/leannative.git"
rev = "82fa4c459ddb8e2166d3dc9c3e5a7ee80071842f"
subDir = "framework/lean"

[[lean_lib]]
name = "WinnowApp"

# The Xcode project's spec, from WinnowApp/Project.lean (LeanNative's framework/native/ci/build-ios runs it).
[[lean_exe]]
name = "ios-project"
root = "IosProject"

# `Backend.realWithMultisig` end to end against a disposable regtest bitcoind (BackendTest.lean).
[[lean_exe]]
name = "backend-test"
root = "BackendTest"

# The records side of the backend, headless (WinnowApp/Real/Records*.lean).
# What Foundation and the Swift app answered for the explorer and peer rules (scripts/foundation-vectors).
[[lean_lib]]
name = "FoundationVectors"

[[lean_exe]]
name = "records-test"
root = "RecordsTest"

# The app's Ledger transport over the shell's ble.* capabilities, against a fake peripheral backed by
# the Lean Ledger simulator.
[[lean_exe]]
name = "ledger-transport-test"
root = "LedgerTransportTest"

# Upstream's MultisigStoreTests and the non-Ledger MultisigAccountFlowTests (WinnowApp/Real/Multisig*.lean).
[[lean_exe]]
name = "multisig-app-test"
root = "MultisigAppTest"

# The encrypted iCloud recovery formats (Winnow/Wallet/CloudWalletBackup.lean, WinnowApp/Real/CloudAppState.lean),
# with Swift's own backups and digests (../Lean/Vectors/cloud-backup.json). Run from LeanApp/.
[[lean_exe]]
name = "cloud-backup-test"
root = "CloudBackupTest"

# The UI journeys: Journeys.lean (the six, as named steps) over Journeys/Screens.lean (what a person does on
# each screen) and Journeys/Host.lean (the fixture's node and Core as a co-signer); run on the Mac by
# LeanNative's ui-tests as UI_JOURNEY (scripts/journeys; CI: ios-app.yml's ui-journey) and headless by
# LeanNative's wire-journeys (`scripts/journeys --wire`; CI: ios-app.yml's wire-journey)
[[lean_lib]]
name = "Journeys"

[[lean_exe]]
name = "journeys"
root = "Journeys"
